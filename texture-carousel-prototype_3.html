<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Тактильная карусель — прототип</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#14110d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:none;color:#f2ece1}
#stage{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
canvas#tex{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.04em;color:rgba(242,236,225,.55);pointer-events:none;transition:opacity .6s ease}
#label{position:absolute;top:28px;left:24px;right:24px;font-size:22px;font-weight:500;letter-spacing:.01em;text-shadow:0 2px 12px rgba(0,0,0,.5);transition:opacity .25s ease;pointer-events:none}
#dots{position:absolute;top:76px;left:24px;display:flex;gap:6px;pointer-events:none}
#dots span{width:5px;height:5px;border-radius:50%;background:rgba(242,236,225,.3)}
#dots span.active{background:#f2ece1}
#unlock{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(20,17,13,.92);color:#f2ece1;font-size:15px;text-align:center;padding:0 40px;cursor:pointer;transition:opacity .35s ease}
#unlock b{display:block;margin-top:6px;font-weight:500}
</style>
</head>
<body>
<div id="stage">
<canvas id="tex"></canvas>
<div id="label"></div>
<div id="dots"></div>
<div id="hint">свайпайте пальцем по текстуре</div>
<div id="unlock"><div>коснитесь экрана<b>чтобы включить звук и вибрацию</b></div></div>
</div>
<script>
'use strict';
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.expand();tg.ready();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();if(tg.setHeaderColor)tg.setHeaderColor('#14110d')}catch(e){}}
const TEXTURES=[
{name:'кора дерева',base:[64,46,30],grain:.55},
{name:'песок',base:[196,171,122],grain:.35},
{name:'листва',base:[45,66,32],grain:.65},
{name:'речная галька',base:[96,102,104],grain:.30}
];
const canvas=document.getElementById('tex');
const ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;canvas.style.width=W+'px';canvas.style.height=H+'px';canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
window.addEventListener('resize',resize);resize();
function buildNoiseTile(tex){const size=96,off=document.createElement('canvas');off.width=off.height=size;const octx=off.getContext('2d'),img=octx.createImageData(size,size),[r,g,b]=tex.base;for(let i=0;i<img.data.length;i+=4){const n=(Math.random()-.5)*255*tex.grain;img.data[i]=Math.max(0,Math.min(255,r+n));img.data[i+1]=Math.max(0,Math.min(255,g+n*.9));img.data[i+2]=Math.max(0,Math.min(255,b+n*.8));img.data[i+3]=255}octx.putImageData(img,0,0);return off}
const tiles=TEXTURES.map(buildNoiseTile);
let offsetPx=0,velocity=0,dragging=false,pointerId=null,lastX=0,lastT=0,fingerX=-1000,fingerY=-1000,currentIndex=0,targetOffset=0;
const labelEl=document.getElementById('label'),dotsEl=document.getElementById('dots'),hintEl=document.getElementById('hint'),unlockEl=document.getElementById('unlock');
TEXTURES.forEach((t,i)=>{const d=document.createElement('span');if(i===0)d.className='active';dotsEl.appendChild(d)});
function normalizeIndex(i){return((i%TEXTURES.length)+TEXTURES.length)%TEXTURES.length}
function updateChrome(){const i=normalizeIndex(currentIndex);labelEl.textContent=TEXTURES[i].name;Array.from(dotsEl.children).forEach((d,k)=>d.className=k===i?'active':'')}
updateChrome();
let audioCtx=null,noiseBuffer=null,noiseSource=null,filter=null,gainNode=null,unlocked=false;
function initAudio(){if(unlocked){if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return}try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();const bufSize=audioCtx.sampleRate*2;noiseBuffer=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);const data=noiseBuffer.getChannelData(0);for(let i=0;i<bufSize;i++)data[i]=Math.random()*2-1;noiseSource=audioCtx.createBufferSource();noiseSource.buffer=noiseBuffer;noiseSource.loop=true;filter=audioCtx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=1200;filter.Q.value=.7;gainNode=audioCtx.createGain();gainNode.gain.value=0;noiseSource.connect(filter);filter.connect(gainNode);gainNode.connect(audioCtx.destination);noiseSource.start();unlocked=true;unlockEl.style.opacity='0';setTimeout(()=>{if(unlockEl.parentNode)unlockEl.remove()},400)}catch(e){}}
function setRustleVolume(speed){if(!unlocked||!audioCtx||!gainNode||!filter)return;const v=Math.min(Math.abs(speed)*1.4,.5);gainNode.gain.setTargetAtTime(v,audioCtx.currentTime,.03);filter.frequency.setTargetAtTime(800+Math.min(Math.abs(speed)*1500,2200),audioCtx.currentTime,.05)}
let lastHapticTick=0;
function hapticTick(intensity){const now=performance.now(),gap=intensity>.6?40:intensity>.3?80:140;if(now-lastHapticTick<gap)return;lastHapticTick=now;try{if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred(intensity>.6?'rigid':intensity>.3?'medium':'light');else if(navigator.vibrate)navigator.vibrate(intensity>.6?12:6)}catch(e){}}
const CARD_W=()=>Math.max(W,1);
function onPointerDown(e){if(e.pointerType==='mouse'&&e.button!==0)return;initAudio();dragging=true;pointerId=e.pointerId;lastX=e.clientX;lastT=performance.now();velocity=0;fingerX=e.clientX;fingerY=e.clientY;try{stage.setPointerCapture(e.pointerId)}catch(err){}e.preventDefault()}
function onPointerMove(e){if(!dragging||e.pointerId!==pointerId)return;const now=performance.now(),dx=e.clientX-lastX,dt=Math.max(now-lastT,1);velocity=dx/dt;offsetPx+=dx;lastX=e.clientX;lastT=now;fingerX=e.clientX;fingerY=e.clientY;setRustleVolume(velocity);hapticTick(Math.min(Math.abs(velocity)*1.2,1));e.preventDefault()}
function onPointerUp(e){if(!dragging||e.pointerId!==pointerId)return;dragging=false;try{stage.releasePointerCapture(e.pointerId)}catch(err){}pointerId=null;const w=CARD_W(),raw=-offsetPx/w;let nearest=Math.round(raw);if(Math.abs(velocity)>.12)nearest=velocity<0?Math.floor(raw+.5)+1:Math.ceil(raw-.5)-1;targetOffset=-nearest*w;velocity=0;fingerX=-1000;fingerY=-1000;e.preventDefault()}
function onPointerCancel(e){if(!dragging||e.pointerId!==pointerId)return;dragging=false;try{stage.releasePointerCapture(e.pointerId)}catch(err){}pointerId=null;velocity=0;targetOffset=-Math.round(offsetPx/CARD_W())*CARD_W();fingerX=-1000;fingerY=-1000}
const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',onPointerDown,{passive:false});stage.addEventListener('pointermove',onPointerMove,{passive:false});stage.addEventListener('pointerup',onPointerUp,{passive:false});stage.addEventListener('pointercancel',onPointerCancel,{passive:false});
unlockEl.addEventListener('pointerdown',e=>{initAudio();e.stopPropagation()},{passive:true});
function updateTargetIndex(){const w=CARD_W(),nearest=Math.round(-targetOffset/w);currentIndex=normalizeIndex(nearest);updateChrome()}
function step(){if(!dragging){const diff=targetOffset-offsetPx;offsetPx+=diff*.18;if(Math.abs(diff)<.5)offsetPx=targetOffset;setRustleVolume(diff*.02)}updateTargetIndex();draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);const w=CARD_W(),centerCard=Math.floor(-offsetPx/w);for(let k=-2;k<=2;k++){const cardNumber=centerCard+k,i=normalizeIndex(cardNumber),x=cardNumber*w+offsetPx;if(x>W||x+w<0)continue;drawCard(TEXTURES[i],tiles[i],x,w)}const atStart=Math.abs(offsetPx)<.5&&Math.abs(targetOffset)<.5&&!dragging;hintEl.style.opacity=atStart?'1':'0'}
function drawCard(tex,tile,x,w){ctx.save();ctx.beginPath();ctx.rect(x,0,w,H);ctx.clip();const pattern=ctx.createPattern(tile,'repeat');if(pattern){ctx.fillStyle=pattern;ctx.fillRect(x,0,w,H)}const grad=ctx.createRadialGradient(x+w/2,H/2,w*.1,x+w/2,H/2,w*.75);grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=grad;ctx.fillRect(x,0,w,H);if(fingerX>x&&fingerX<x+w&&fingerY>0&&fingerY<H){const r=46,indent=ctx.createRadialGradient(fingerX,fingerY,0,fingerX,fingerY,r);indent.addColorStop(0,'rgba(0,0,0,.35)');indent.addColorStop(.6,'rgba(0,0,0,.12)');indent.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=indent;ctx.beginPath();ctx.arc(fingerX,fingerY,r,0,Math.PI*2);ctx.fill();const rim=ctx.createRadialGradient(fingerX-8,fingerY-8,0,fingerX-8,fingerY-8,r*.5);rim.addColorStop(0,'rgba(255,255,255,.18)');rim.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=rim;ctx.beginPath();ctx.arc(fingerX,fingerY,r,0,Math.PI*2);ctx.fill()}if(dragging&&Math.abs(velocity)>.05){ctx.globalAlpha=Math.min(Math.abs(velocity)*.5,.35);ctx.fillStyle='rgba(0,0,0,.25)';const streaks=5,sw=Math.max(2,Math.abs(velocity)*40);for(let s=0;s<streaks;s++)ctx.fillRect(x+(s/streaks)*w,0,sw,H);ctx.globalAlpha=1}ctx.restore()}
requestAnimationFrame(step);
</script>
</body>
</html>
