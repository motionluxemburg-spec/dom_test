<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Тактильная карусель — прототип</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #14110d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    color: #f2ece1;
  }
  #stage { position: relative; width: 100%; height: 100%; }
  canvas#tex { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hint {
    position: absolute; bottom: 34px; left: 0; right: 0;
    text-align: center; font-size: 13px; letter-spacing: .04em;
    color: rgba(242,236,225,.55); pointer-events: none;
    transition: opacity .6s ease;
  }
  #label {
    position: absolute; top: 28px; left: 24px; right: 24px;
    font-size: 22px; font-weight: 500; letter-spacing: .01em;
    text-shadow: 0 2px 12px rgba(0,0,0,.5);
    transition: opacity .25s ease;
  }
  #dots {
    position: absolute; top: 76px; left: 24px; display: flex; gap: 6px;
  }
  #dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(242,236,225,.3);
  }
  #dots span.active { background: #f2ece1; }
  #unlock {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: rgba(20,17,13,.92); color: #f2ece1;
    font-size: 15px; text-align: center; padding: 0 40px;
  }
  #unlock b { display:block; margin-top: 6px; font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="tex"></canvas>
  <div id="label"></div>
  <div id="dots"></div>
  <div id="hint">свайпайте пальцем по текстуре</div>
  <div id="unlock">коснитесь экрана
    <b>чтобы включить звук и вибрацию</b>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.expand();
  tg.ready();
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  if (tg.setHeaderColor) { try { tg.setHeaderColor('#14110d'); } catch(e) {} }
}

// ---------- textures (procedural, no external images needed) ----------
const TEXTURES = [
  { name: 'кора дерева',   base: [64,46,30],  grain: 0.55, hue: 22 },
  { name: 'песок',         base: [196,171,122], grain: 0.35, hue: 38 },
  { name: 'листва',        base: [45,66,32],  grain: 0.65, hue: 96 },
  { name: 'речная галька', base: [96,102,104], grain: 0.30, hue: 200 },
];

const canvas = document.getElementById('tex');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth = window.innerWidth;
  H = canvas.clientHeight = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

// pre-render a noise tile per texture (cheap grain, no external assets)
function buildNoiseTile(tex) {
  const size = 96;
  const off = document.createElement('canvas');
  off.width = off.height = size;
  const octx = off.getContext('2d');
  const img = octx.createImageData(size, size);
  const [r,g,b] = tex.base;
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 255 * tex.grain;
    img.data[i]   = Math.max(0, Math.min(255, r + n));
    img.data[i+1] = Math.max(0, Math.min(255, g + n*0.9));
    img.data[i+2] = Math.max(0, Math.min(255, b + n*0.8));
    img.data[i+3] = 255;
  }
  octx.putImageData(img, 0, 0);
  return off;
}
const tiles = TEXTURES.map(buildNoiseTile);

// ---------- state ----------
let index = 0;              // current texture index (fractional while swiping)
let offsetPx = 0;           // current visual offset within the card, px
let velocity = 0;           // px/ms
let lastX = 0, lastT = 0;
let dragging = false;
let fingerX = -1000, fingerY = -1000; // for the finger-indent illusion

const labelEl = document.getElementById('label');
const dotsEl  = document.getElementById('dots');
const hintEl  = document.getElementById('hint');
const unlockEl = document.getElementById('unlock');

TEXTURES.forEach((t, i) => {
  const d = document.createElement('span');
  if (i === 0) d.className = 'active';
  dotsEl.appendChild(d);
});
function updateChrome() {
  const i = Math.round(index) % TEXTURES.length;
  labelEl.textContent = TEXTURES[i].name;
  [...dotsEl.children].forEach((d, k) => d.className = k === i ? 'active' : '');
}
updateChrome();

// ---------- audio: procedural rustle, volume tied to swipe speed ----------
let audioCtx, noiseBuffer, noiseSource, filter, gainNode, unlocked = false;
function initAudio() {
  if (unlocked) return;
  unlocked = true;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const bufSize = audioCtx.sampleRate * 2;
  noiseBuffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

  noiseSource = audioCtx.createBufferSource();
  noiseSource.buffer = noiseBuffer;
  noiseSource.loop = true;

  filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1200;
  filter.Q.value = 0.7;

  gainNode = audioCtx.createGain();
  gainNode.gain.value = 0;

  noiseSource.connect(filter).connect(gainNode).connect(audioCtx.destination);
  noiseSource.start();

  unlockEl.style.opacity = 0;
  setTimeout(() => unlockEl.remove(), 400);
}
function setRustleVolume(speedPxMs) {
  if (!unlocked) return;
  const v = Math.min(Math.abs(speedPxMs) * 1.4, 0.5);
  gainNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.03);
  filter.frequency.setTargetAtTime(800 + Math.min(Math.abs(speedPxMs)*1500, 2200), audioCtx.currentTime, 0.05);
}

// ---------- haptics: Telegram API (works iOS+Android) with vibrate() fallback ----------
let lastHapticTick = 0;
function hapticTick(intensity) {
  const now = performance.now();
  const minGap = intensity > 0.6 ? 40 : intensity > 0.3 ? 80 : 140;
  if (now - lastHapticTick < minGap) return;
  lastHapticTick = now;
  if (tg && tg.HapticFeedback) {
    tg.HapticFeedback.impactOccurred(intensity > 0.6 ? 'rigid' : intensity > 0.3 ? 'medium' : 'light');
  } else if (navigator.vibrate) {
    navigator.vibrate(intensity > 0.6 ? 12 : 6); // Android only; iOS Safari/WebView ignores this
  }
}

// ---------- pointer / swipe physics ----------
const CARD_W = () => W;

function onDown(e) {
  initAudio();
  dragging = true;
  lastX = e.clientX; lastT = performance.now();
  velocity = 0;
  fingerX = e.clientX; fingerY = e.clientY;
}
function onMove(e) {
  fingerX = e.clientX; fingerY = e.clientY;
  if (!dragging) return;
  const t = performance.now();
  const dx = e.clientX - lastX;
  const dt = Math.max(t - lastT, 1);
  velocity = dx / dt; // px/ms, signed
  offsetPx += dx;
  lastX = e.clientX; lastT = t;

  setRustleVolume(velocity);
  hapticTick(Math.min(Math.abs(velocity) * 1.2, 1));
}
function onUp() {
  dragging = false;
  fingerX = fingerY = -1000;
}
const stage = document.getElementById('stage');

stage.addEventListener('pointerdown', onDown);
stage.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);

// touch fallback, attached to the whole stage (not canvas) so the gesture
// keeps working even if it started on the "tap to unlock" overlay —
// touch events keep firing on the element that was first touched.
function touchToPoint(e) {
  const t = e.touches[0] || e.changedTouches[0];
  return { clientX: t.clientX, clientY: t.clientY };
}
stage.addEventListener('touchstart', e => { e.preventDefault(); onDown(touchToPoint(e)); }, { passive: false });
stage.addEventListener('touchmove',  e => { e.preventDefault(); onMove(touchToPoint(e)); }, { passive: false });
stage.addEventListener('touchend',   e => { e.preventDefault(); onUp(); }, { passive: false });
stage.addEventListener('touchcancel',e => { e.preventDefault(); onUp(); }, { passive: false });

// ---------- render loop: inertia + texture deformation + finger indent ----------
function step() {
  if (!dragging) {
    // inertia decay
    offsetPx += velocity * 16;
    velocity *= 0.92;
    if (Math.abs(velocity) < 0.01) velocity = 0;
    setRustleVolume(velocity);
  }

  // snap logic: settle to nearest card once slow enough
  const w = CARD_W();
  if (!dragging && Math.abs(velocity) < 0.02) {
    const target = -Math.round(offsetPx / w) * w;
    offsetPx += (target - offsetPx) * 0.18;
    if (Math.abs(target - offsetPx) < 0.5) offsetPx = target;
  }
  index = ((-offsetPx / w) % TEXTURES.length + TEXTURES.length) % TEXTURES.length;
  updateChrome();

  draw();
  requestAnimationFrame(step);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const w = CARD_W();
  const baseIdx = Math.floor(-offsetPx / w);
  for (let k = -1; k <= 1; k++) {
    const i = ((baseIdx + k) % TEXTURES.length + TEXTURES.length) % TEXTURES.length;
    const x = (baseIdx + k) * w + offsetPx;
    drawCard(TEXTURES[i], tiles[i], x, w);
  }
  hintEl.style.opacity = (offsetPx !== 0 || velocity !== 0 || dragging) ? 0 : 1;
}

function drawCard(tex, tile, x, w) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, 0, w, H);
  ctx.clip();

  // tiled grain fill
  const pattern = ctx.createPattern(tile, 'repeat');
  ctx.fillStyle = pattern;
  ctx.translate(x, 0);
  ctx.fillRect(0, 0, w, H);
  ctx.translate(-x, 0);

  // subtle vignette so texture reads as physical material
  const grad = ctx.createRadialGradient(x + w/2, H/2, w*0.1, x + w/2, H/2, w*0.75);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = grad;
  ctx.fillRect(x, 0, w, H);

  // finger indent illusion: local highlight + shadow following touch point
  if (fingerX > x && fingerX < x + w && fingerY > 0) {
    const r = 46;
    const indent = ctx.createRadialGradient(fingerX, fingerY, 0, fingerX, fingerY, r);
    indent.addColorStop(0, 'rgba(0,0,0,0.35)');
    indent.addColorStop(0.6, 'rgba(0,0,0,0.12)');
    indent.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = indent;
    ctx.beginPath();
    ctx.arc(fingerX, fingerY, r, 0, Math.PI*2);
    ctx.fill();

    const rim = ctx.createRadialGradient(fingerX-8, fingerY-8, 0, fingerX-8, fingerY-8, r*0.5);
    rim.addColorStop(0, 'rgba(255,255,255,0.18)');
    rim.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rim;
    ctx.beginPath();
    ctx.arc(fingerX, fingerY, r, 0, Math.PI*2);
    ctx.fill();
  }

  // deformation streaks proportional to velocity (stretch in swipe direction)
  if (Math.abs(velocity) > 0.05) {
    ctx.globalAlpha = Math.min(Math.abs(velocity) * 0.5, 0.35);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    const streaks = 5;
    for (let s = 0; s < streaks; s++) {
      const sx = x + (s / streaks) * w;
      ctx.fillRect(sx, 0, Math.max(2, Math.abs(velocity) * 40), H);
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

requestAnimationFrame(step);
</script>
</body>
</html>
